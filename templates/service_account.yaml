# Common service account for all RonDB node pods. Unlike the Kubernetes-owned
# 'default' account, this one is chart-owned and can carry annotations (e.g. the
# AWS IRSA role-arn) via .Values.serviceAccountAnnotations, so the backup upload
# that runs inside the data-node pods can authenticate to object storage.
#
# Always rendered: some referencing pods (rdrs, mysqld_exporter, binlog servers,
# benchmark) are created even when RonDB is externally managed, so the account
# must exist unconditionally to avoid dangling serviceAccountName references.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rondb.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{ include "rondb.serviceAccountAnnotations" $ | indent 2 }}
